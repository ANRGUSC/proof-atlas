name: Publish Proof Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proof-atlas-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build explorer and dashboard from project records
        run: python3 tools/proof-atlas/scripts/atlas.py build .
      - name: Check publication files and evidence links
        run: |
          python3 - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          root = Path("dist")
          for name in ("index.html", "proofs/index.html", "progress.html", "manuscript.pdf", "graph.js", "dagre/dagre.min.js"):
              assert (root / name).stat().st_size, name
          from html import escape
          project = json.loads(Path("project.json").read_text())
          for name in ("index.html", "proofs/index.html", "progress.html"):
              html = (root / name).read_text(encoding="utf-8")
              caption = html.split("</h1>", 1)[1].split("</p>", 1)[0]
              assert '<a href="manuscript.pdf">' in caption, f"{name}: missing header PDF link"
              if publication := project.get("publication"):
                  assert f'<a href="{escape(publication, quote=True)}">' in caption, f"{name}: missing publication link"
          for item in project.get("work", {}).values():
              if log := item.get("run_log"):
                  body = Path(log).read_bytes()
                  assert (root / "logs" / (sha256(body).hexdigest() + ".txt")).read_bytes() == body
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish
        id: publish
        uses: actions/deploy-pages@v4
